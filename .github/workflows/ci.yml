name: CI

on:
  push:
    branches: [ "main", "master", "dev_next" ]
  pull_request:
    branches: [ "main", "master", "dev_next" ]
  workflow_dispatch:

jobs:
  test-unix:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests and enforce 80% coverage gate
        run: |
          python tests/run_coverage.py --fast
          pytest tests/run_coverage.py

      - name: Run lifecycle & platform script tests (Bash)
        run: |
          bash tests/test_plugin_scripts.sh

      - name: Run quick benchmark smoke checks
        run: |
          python tests/benchmark_suite.py --run-current --quick

  test-windows:
    name: Windows - Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests and enforce 80% coverage gate
        run: |
          python tests/run_coverage.py --fast
          pytest tests/run_coverage.py

      - name: Run lifecycle & platform script tests (PowerShell)
        shell: pwsh
        run: |
          pwsh -File tests/test_plugin_scripts.ps1

      - name: Run quick benchmark smoke checks
        run: |
          python tests/benchmark_suite.py --run-current --quick
