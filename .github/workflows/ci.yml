name: CI

on:
  push:
    branches: [ "main", "master", "dev_next" ]
  pull_request:
    branches: [ "main", "master", "dev_next" ]
  schedule:
    # Weekly Sunday 05:00 UTC live test-account verification (gracefully skips if secrets are absent)
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: "Functional suites to run against the live Google Ads Test Account"
        type: choice
        default: "all"
        options:
          - "all"
          - "hitl"
          - "skills"
          - "eval"
      validate_only:
        description: "Pass --validate-only to the HITL policy functional suite (read-only/dry-run safe mode)"
        type: boolean
        default: true
      run_llm_evals:
        description: "Run live LLM-in-the-loop skill evaluations via Gemini API (requires GEMINI_API_KEY secret)"
        type: boolean
        default: false

# Least-privilege token for every job: the workflow only reads repository contents.
permissions:
  contents: read

jobs:
  test-unix:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip_log="$(mktemp)"
          if ! python -m pip install --upgrade -r requirements.txt 2>&1 | tee "${pip_log}"; then
            # google-ads releases on PyPI declare an upper Requires-Python bound (google-ads 35.0.0
            # declares >=3.10,<3.15), so pip finds no google-ads>=25.0.0 on newer interpreters.
            # Retry with --ignore-requires-python only for that error; other failures stop the job.
            if grep -q "require a different python version" "${pip_log}"; then
              echo "::warning title=google-ads Requires-Python::No google-ads release on PyPI supports Python ${{ matrix.python-version }} yet. Installing with --ignore-requires-python."
              python -m pip install --upgrade --ignore-requires-python -r requirements.txt
            else
              exit 1
            fi
          fi

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests and enforce 80% coverage gate
        run: |
          python tests/run_coverage.py --fast
          pytest tests/run_coverage.py

      - name: Run lifecycle & platform script tests (Bash)
        run: |
          bash tests/test_plugin_scripts.sh

      - name: Run quick benchmark smoke checks
        run: |
          python tests/benchmark_suite.py --run-current --quick

      - name: Run deterministic skill & prompt eval checks (offline)
        run: |
          python tests/eval_skills_suite.py --mode offline

      - name: Run offline non-mutation skills functional checks
        run: |
          python tests/skills_functional_suite.py --offline

  test-windows:
    name: Windows - Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip_log="$(mktemp)"
          if ! python -m pip install --upgrade -r requirements.txt 2>&1 | tee "${pip_log}"; then
            # google-ads releases on PyPI declare an upper Requires-Python bound (google-ads 35.0.0
            # declares >=3.10,<3.15), so pip finds no google-ads>=25.0.0 on newer interpreters.
            # Retry with --ignore-requires-python only for that error; other failures stop the job.
            if grep -q "require a different python version" "${pip_log}"; then
              echo "::warning title=google-ads Requires-Python::No google-ads release on PyPI supports Python ${{ matrix.python-version }} yet. Installing with --ignore-requires-python."
              python -m pip install --upgrade --ignore-requires-python -r requirements.txt
            else
              exit 1
            fi
          fi

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run unit tests and enforce 80% coverage gate
        run: |
          python tests/run_coverage.py --fast
          pytest tests/run_coverage.py

      - name: Run lifecycle & platform script tests (PowerShell)
        shell: pwsh
        run: |
          pwsh -File tests/test_plugin_scripts.ps1

      - name: Run quick benchmark smoke checks
        run: |
          python tests/benchmark_suite.py --run-current --quick

      - name: Run deterministic skill & prompt eval checks (offline)
        run: |
          python tests/eval_skills_suite.py --mode offline

      - name: Run offline non-mutation skills functional checks
        run: |
          python tests/skills_functional_suite.py --offline

  live-functional-test-account:
    name: Live Google Ads Test Account & Optional LLM Evals
    runs-on: ubuntu-latest
    # Live credentials are only exposed to protected branches, never to fork PRs
    # (pull_request events never match), and only after the environment's required
    # reviewers approve the run.
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev_next')
    environment: live-test-account
    permissions:
      contents: read

    steps:
      - name: Check live functional secrets availability
        id: check_secrets
        shell: bash
        env:
          TEST_CID: ${{ secrets.GOOGLE_ADS_TEST_CUSTOMER_ID }}
          YAML_B64: ${{ secrets.GOOGLE_ADS_YAML_B64 }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$TEST_CID" ] && [ -n "$YAML_B64" ]; then
            echo "has_ads_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ads_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_ADS_TEST_CUSTOMER_ID / GOOGLE_ADS_YAML_B64 secrets are not configured; skipping live Google Ads Test Account run."
          fi
          if [ -n "$GEMINI_KEY" ]; then
            echo "has_gemini_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gemini_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_secrets.outputs.has_ads_creds == 'true' || steps.check_secrets.outputs.has_gemini_key == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.13
        if: steps.check_secrets.outputs.has_ads_creds == 'true' || steps.check_secrets.outputs.has_gemini_key == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.check_secrets.outputs.has_ads_creds == 'true' || steps.check_secrets.outputs.has_gemini_key == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt

      - name: Materialize 0600 temporary google-ads.yaml outside repo
        if: steps.check_secrets.outputs.has_ads_creds == 'true'
        shell: bash
        env:
          YAML_B64: ${{ secrets.GOOGLE_ADS_YAML_B64 }}
        run: |
          umask 077
          printf '%s' "$YAML_B64" | base64 -d > "${RUNNER_TEMP}/google-ads.yaml"
          chmod 600 "${RUNNER_TEMP}/google-ads.yaml"
          mkdir -p "${RUNNER_TEMP}/functional_artifacts"

      - name: Run HITL Policy Functional Suite (Live Test Account)
        if: steps.check_secrets.outputs.has_ads_creds == 'true' && (github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'hitl')
        shell: bash
        env:
          TEST_CID: ${{ secrets.GOOGLE_ADS_TEST_CUSTOMER_ID }}
          LOGIN_CID: ${{ secrets.GOOGLE_ADS_TEST_LOGIN_CUSTOMER_ID }}
          VALIDATE_ONLY: ${{ github.event_name == 'schedule' && 'true' || inputs.validate_only }}
        run: |
          args=(
            --customer-id "$TEST_CID"
            --credentials-yaml "${RUNNER_TEMP}/google-ads.yaml"
            --audit-log "${RUNNER_TEMP}/functional_artifacts/hitl_live_audit.jsonl"
          )
          if [ -n "$LOGIN_CID" ]; then
            args+=(--login-customer-id "$LOGIN_CID")
          fi
          if [ "$VALIDATE_ONLY" = "true" ]; then
            args+=(--validate-only)
          fi
          python tests/hitl_policy_functional_suite.py "${args[@]}"

      - name: Run Non-Mutation Skills Functional Suite (Live Test Account)
        if: steps.check_secrets.outputs.has_ads_creds == 'true' && (github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'skills')
        shell: bash
        env:
          TEST_CID: ${{ secrets.GOOGLE_ADS_TEST_CUSTOMER_ID }}
          LOGIN_CID: ${{ secrets.GOOGLE_ADS_TEST_LOGIN_CUSTOMER_ID }}
        run: |
          args=(
            --customer-id "$TEST_CID"
            --credentials-yaml "${RUNNER_TEMP}/google-ads.yaml"
            --audit-log "${RUNNER_TEMP}/functional_artifacts/skills_live_audit.jsonl"
          )
          if [ -n "$LOGIN_CID" ]; then
            args+=(--login-customer-id "$LOGIN_CID")
          fi
          python tests/skills_functional_suite.py "${args[@]}"

      - name: Run Live LLM-in-the-Loop Skill Evals (Gemini API)
        if: steps.check_secrets.outputs.has_gemini_key == 'true' && (inputs.run_llm_evals == true || inputs.suite == 'eval')
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/functional_artifacts"
          python tests/eval_skills_suite.py \
            --mode live \
            --provider gemini-api \
            --json-out "${RUNNER_TEMP}/functional_artifacts/llm_eval_report.json"

      - name: Build redacted pass/fail summary
        if: always() && (steps.check_secrets.outputs.has_ads_creds == 'true' || steps.check_secrets.outputs.has_gemini_key == 'true')
        shell: bash
        run: |
          # The raw audit JSONL files hold customer IDs, subprocess argv and stdout/stderr.
          # The repository is public, so only test IDs and outcomes leave the runner.
          mkdir -p "${RUNNER_TEMP}/functional_summary"
          python - "${RUNNER_TEMP}/functional_artifacts" "${RUNNER_TEMP}/functional_summary/summary.json" <<'PY'
          import glob, json, os, sys
          src, out = sys.argv[1], sys.argv[2]
          summary = {}
          for path in sorted(glob.glob(os.path.join(src, "*.jsonl"))):
              rows = []
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      try:
                          rec = json.loads(line)
                      except ValueError:
                          continue
                      if rec.get("record_type") == "TEST_RESULT":
                          rows.append({
                              "test_id": str(rec.get("test_id", "")),
                              "suite": str(rec.get("suite", "")),
                              "outcome": str(rec.get("outcome", "")),
                          })
              summary[os.path.basename(path)] = rows
          with open(out, "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2)
          PY

      - name: Shred temporary credentials and raw audit logs
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/google-ads.yaml"
          rm -rf "${RUNNER_TEMP}/functional_artifacts"

      - name: Upload redacted pass/fail summary
        if: always() && (steps.check_secrets.outputs.has_ads_creds == 'true' || steps.check_secrets.outputs.has_gemini_key == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-functional-summary
          path: ${{ runner.temp }}/functional_summary/summary.json
          if-no-files-found: ignore
          retention-days: 3
